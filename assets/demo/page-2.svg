<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>
  <rect width="800" height="1100" fill="url(#p2Grad)" />
  <!-- Dungeon Gate & Glowing Runes -->
  <rect x="250" y="320" width="300" height="500" rx="150" fill="#030712" stroke="#1e3a8a" stroke-width="12" />
  <!-- Runes along gate -->
  <circle cx="400" cy="570" r="80" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.6" stroke-dasharray="10 5" />
  <circle cx="400" cy="570" r="50" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.8" />
  <!-- Floor perspective -->
  <line x1="100" y1="920" x2="300" y2="800" stroke="#1e293b" stroke-width="3" />
  <line x1="700" y1="920" x2="500" y2="800" stroke="#1e293b" stroke-width="3" />
  <line x1="400" y1="920" x2="400" y2="800" stroke="#1e293b" stroke-width="3" />
  <!-- Torches -->
  <circle cx="180" cy="460" r="16" fill="#f59e0b" opacity="0.8" />
  <circle cx="180" cy="460" r="35" fill="#f59e0b" opacity="0.2" />
  <circle cx="620" cy="460" r="16" fill="#f59e0b" opacity="0.8" />
  <circle cx="620" cy="460" r="35" fill="#f59e0b" opacity="0.2" />
  <text x="400" y="1020" font-family="'Outfit', sans-serif" font-size="20" fill="#64748b" text-anchor="middle">
    — Страница 2 : Врата Подземелья —
  </text>
</svg>
